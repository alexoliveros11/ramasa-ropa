{% extends 'productos/base.html' %}
{% block title %}Formulario{% endblock %}
{% block content %}
<h2>{% if object %}Editar{% else %}Crear{% endif %} Producto</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a class="btn btn-secondary" href="{% url 'producto_list' %}">Cancelar</a>
</form>
{% endblock %}
